/* MarketMate v1.3 — design reference system */
:root{
  --bg:#f7f3ea;
  --panel:#fffefa;
  --panel2:#f4f0e7;
  --ink:#111a16;
  --muted:#59655e;
  --muted2:#829087;
  --line:#e8e1d6;
  --forest:#083828;
  --forest2:#0f503b;
  --forest3:#467a68;
  --mint:#95efbf;
  --accent:#d3a14f;
  --soft:#f1ede5;
  --shadow:0 18px 42px rgba(40,39,32,.08);
  --shadow-lg:0 28px 80px rgba(25,30,26,.18);
  --radius:28px;
  --radius-sm:14px;
}
body{background:var(--bg);font-size:15px}
.app{grid-template-columns:310px minmax(0,1fr)}
.sidebar{padding:34px 24px 24px;background:#073728}
.brand{font-size:34px;line-height:1;letter-spacing:-.045em;margin:8px 12px 11px;color:#fff}
.brand small{font-size:11px;letter-spacing:.12em;margin-top:17px;color:#78aa91;opacity:1}
.shopname{
  position:relative;margin:26px 0 34px;padding:15px 46px 15px 48px;
  border:1px solid rgba(135,231,180,.16);border-radius:999px;
  background:rgba(0,0,0,.10);font-size:16px;font-weight:750;color:#fff;
}
.shopname:before{content:"";position:absolute;left:24px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:var(--mint);border-radius:50%}
.shopname:after{content:"⌃\A⌄";white-space:pre;position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:12px;line-height:.65;color:#8db8a5}
.nav{gap:8px}
.nav button{
  position:relative;color:#7da18f;padding:12px 18px;border-radius:13px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;
}
.nav button .ico{width:22px;font-size:19px;color:#7fa392;opacity:1}
.nav button:hover{background:rgba(255,255,255,.035);color:#c5dacf}
.nav button.active{background:transparent;color:#f7fff9;box-shadow:none}
.nav button.active .ico{color:#a7f3c9}
.nav button.active:after{
  content:"";position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--mint)
}
.nav .sep{margin:12px 12px;background:rgba(255,255,255,.08)}
.sidefoot{
  border:1px solid rgba(139,235,185,.14);border-radius:22px;padding:18px 22px;
  margin:22px 0 0;background:rgba(0,0,0,.12);font-size:13px;color:#76a58e;line-height:1.5
}
.sidefoot strong{display:block;color:#9df5c4;font-size:14px;letter-spacing:.09em;margin-bottom:5px}
.main{padding:38px 48px 58px;max-width:1620px}
.topbar{margin-bottom:24px}
h1{font-size:32px}
h2{font-size:23px;letter-spacing:-.035em}
.card{
  border:0;border-radius:28px;padding:28px 34px;
  box-shadow:0 16px 38px rgba(55,50,39,.065);background:#fff
}
.card.hover:hover{transform:translateY(-2px);box-shadow:0 22px 45px rgba(55,50,39,.09)}
.section{margin-top:20px}
.sectionhead{margin-bottom:18px}
.sectionicon{
  width:42px;height:42px;border:0;border-radius:50%;background:#f1eee7;
  font-size:22px;color:#0e241b;font-weight:800
}
.badge{background:#f1eee7;padding:6px 12px;font-size:11px;letter-spacing:.05em}
.btn{border-color:#e4ddd1;border-radius:13px;padding:10px 15px;background:#fff}
.btn.primary{background:var(--forest);border-color:var(--forest)}
.hero{padding:28px 34px}
.hero:after{display:none}
.hero h2{font-size:28px}
.hero-meta span{background:#f4f0e7;border:0}
.kpi{padding:22px 24px;border-radius:22px;background:#fff}
.kpi:before{display:none}
.kpi .label{font-size:10px}
.kpi .value{font-size:29px}
.checkrow{padding:14px 4px;border-bottom:1px solid #eee8dd;border-radius:0}
.checkrow:last-child{border-bottom:0}
.checkrow:hover{background:transparent}
.checkrow input{width:27px;height:27px;appearance:none;border:1.5px solid #cfc9bd;border-radius:10px;background:#fff;position:relative}
.checkrow input:checked{background:var(--forest);border-color:var(--forest)}
.checkrow input:checked:after{content:"✓";position:absolute;color:white;left:6px;top:1px;font-size:16px;font-weight:800}
.quickactions{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}

.qa-card strong{font-size:17px;line-height:1.15;letter-spacing:-.02em}

  display:flex;flex-direction:column;justify-content:center

.metricmini span{font-size:10px;font-weight:800;color:#344039}
.metricmini strong{font-size:22px;line-height:1.08;margin-top:10px;white-space:normal;overflow-wrap:anywhere}
.dashboard-footer{

  border-top:1px solid #ece6dc;margin-top:18px;padding-top:17px;color:#37423c

.dashboard-footer .linkbtn{
  border:0;background:transparent;padding:0;color:#1d3128;font-weight:750;letter-spacing:.08em;font-size:12px

.health-status{font-size:12px;font-weight:800;color:#0f7f4c;letter-spacing:.04em;white-space:nowrap}
.health-status:before{content:"";display:inline-block;width:8px;height:8px;background:#17894f;border-radius:50%;margin-right:7px}
.stock-clear{text-align:center;padding:2px 22px 24px;color:#26362f;line-height:1.45;font-size:15px}
.stock-clear strong{display:block;font-size:18px;margin-bottom:7px}
.add-task{
  border:0;background:transparent;color:#0d5f3f;font-weight:800;font-size:14px;padding:0
}
.tablewrap{border-radius:20px}
.eventcard .metrics{gap:12px}
.notice{border:0;border-radius:18px}

/* MarketMate v1.4.0 — laptop layout fixes */
.sidebar{
  height:100dvh;
  min-height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(149,239,191,.22) transparent;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(149,239,191,.20);border-radius:999px}

/* Let quick actions choose a sensible column count based on the card width,
   rather than forcing four narrow tiles on laptop screens. */
.quickactions{
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
}
.quickactions .qa-card{
  min-width:145px;
}
.qa-card strong{
  white-space:normal;
}

/* Event cards should never split currency/short KPI values across lines. */
.eventcard .metricmini strong{
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  font-size:20px;
}
.eventcard .metricmini{
  min-width:0;
}

/* Use card width, not viewport assumptions, to avoid cramped event layouts. */
#view > .grid.cols3{
  grid-template-columns:repeat(auto-fit,minmax(315px,1fr));
}

/* Laptop middle state: give dense dashboard areas more breathing room. */
@media (max-width:1450px){
  .app{grid-template-columns:270px minmax(0,1fr)}
  .main{padding:30px 32px 48px}
  .grid.cols2{gap:16px}
  .card{padding:24px 26px}
  .quickactions{grid-template-columns:repeat(2,minmax(145px,1fr))}
  .quickactions .qa-card{min-height:160px}
  .metricmini{padding:20px}
}
@media (max-width:1220px){
  .app{grid-template-columns:250px minmax(0,1fr)}
  .main{padding:26px 24px 42px}
  #view > .grid.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  #view > .grid.cols3{grid-template-columns:1fr}
}

<div class="toast" id="toast"></div>

<script>
const VERSION="1.4.0-demo", KEY="marketmate_demo_sandbox_v1", DEMO_MODE=true, DEMO_PRODUCT_LIMIT=8, DEMO_EVENT_LIMIT=5;
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat(state.settings.locale||'en-AU',{style:'currency',currency:state.settings.currency||'AUD',maximumFractionDigits:0}).format(Number(n||0));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function demoData(){
 const products=[
  {id:"p1",name:"Botanical Earrings",sku:"EAR-BOT",category:"Jewellery",price:38,material:5,labor:6,packaging:1.5,other:0,stock:14,threshold:5,active:true},
  {id:"p2",name:"Vanilla Soy Candle",sku:"CAN-VAN",category:"Candles",price:28,material:8,labor:4,packaging:2,other:0,stock:12,threshold:6,active:true},
  {id:"p3",name:"Sandalwood Candle",sku:"CAN-SAN",category:"Candles",price:32,material:9,labor:4,packaging:2,other:0,stock:8,threshold:5,active:true},
  {id:"p4",name:"Mini Art Print",sku:"PR-MINI",category:"Prints",price:18,material:3,labor:2,packaging:1,other:0,stock:26,threshold:10,active:true},
  {id:"p5",name:"Greeting Card Set",sku:"CARD-SET",category:"Paper",price:16,material:4,labor:2,packaging:1,other:0,stock:20,threshold:8,active:true},
  {id:"p6",name:"Ceramic Trinket Dish",sku:"CER-DISH",category:"Ceramics",price:34,material:7,labor:8,packaging:2,other:1,stock:6,threshold:4,active:true}
 ];
 const events=[
  {id:"e1",name:"Newtown Makers Market",venue:"Newtown Community Hall",location:"Newtown NSW",date:"2026-08-22",start:"09:00",end:"16:00",status:"Completed",stall:140,travel:35,parking:20,staff:0,misc:15,target:2500,feePaid:true,attend:"Yes",notes:"Strong jewellery and candle sales."},
  {id:"e2",name:"Inner West Handmade",venue:"Marrickville Pavilion",location:"Marrickville NSW",date:"2026-09-05",start:"10:00",end:"16:00",status:"Completed",stall:120,travel:25,parking:15,staff:0,misc:20,target:2200,feePaid:true,attend:"Maybe",notes:"Prints slower than expected."},
  {id:"e3",name:"Sydney Makers Market",venue:"Carriageworks",location:"Eveleigh NSW",date:"2026-10-12",start:"09:00",end:"17:00",status:"Confirmed",stall:180,travel:30,parking:25,staff:0,misc:20,target:3000,feePaid:true,attend:"",notes:""}
 ];
 const allocations=[
  {eventId:"e1",productId:"p1",planned:12,packed:12},{eventId:"e1",productId:"p2",planned:20,packed:20},{eventId:"e1",productId:"p3",planned:16,packed:16},{eventId:"e1",productId:"p4",planned:30,packed:30},{eventId:"e1",productId:"p5",planned:22,packed:22},{eventId:"e1",productId:"p6",planned:10,packed:10},
  {eventId:"e2",productId:"p1",planned:10,packed:10},{eventId:"e2",productId:"p2",planned:18,packed:18},{eventId:"e2",productId:"p3",planned:14,packed:14},{eventId:"e2",productId:"p4",planned:28,packed:28},{eventId:"e2",productId:"p5",planned:18,packed:18},{eventId:"e2",productId:"p6",planned:8,packed:8},
  {eventId:"e3",productId:"p1",planned:14,packed:10},{eventId:"e3",productId:"p2",planned:24,packed:18},{eventId:"e3",productId:"p3",planned:18,packed:12},{eventId:"e3",productId:"p4",planned:30,packed:24},{eventId:"e3",productId:"p5",planned:24,packed:20},{eventId:"e3",productId:"p6",planned:10,packed:6},
 ];
 const sales=[];
 function add(eventId,productId,qty,price,payment,day){
   sales.push({id:uid(),eventId,productId,qty,price,discount:0,payment,date:day});
 }
 add("e1","p1",10,38,"Card","2026-08-22T10:15"); add("e1","p2",18,28,"Card","2026-08-22T11:05");
 add("e1","p3",12,32,"Cash","2026-08-22T12:10"); add("e1","p4",8,18,"Card","2026-08-22T13:20");
 add("e1","p5",11,16,"Cash","2026-08-22T14:10"); add("e1","p6",7,34,"Card","2026-08-22T15:05");
 add("e2","p1",7,38,"Card","2026-09-05T10:45"); add("e2","p2",13,28,"Card","2026-09-05T11:40");
 add("e2","p3",9,32,"Cash","2026-09-05T12:15"); add("e2","p4",5,18,"Card","2026-09-05T13:00");
 add("e2","p5",9,16,"Card","2026-09-05T14:20"); add("e2","p6",4,34,"Cash","2026-09-05T15:10");
 return {
  schema:1,version:VERSION,lastBackup:null,
  settings:{business:"Willow & Field Studio",currency:"AUD",locale:"en-AU",lowStock:5},
  products,events,allocations,sales,
  expenses:[
    {id:"x1",eventId:"e1",type:"Extra supplies",amount:45,date:"2026-08-22"},
    {id:"x2",eventId:"e2",type:"Lunch/incidentals",amount:28,date:"2026-09-05"}
  ],
  tasks:[
    {id:"t1",eventId:"e3",text:"Make 12 botanical earrings",done:false},
    {id:"t2",eventId:"e3",text:"Print price labels",done:true},
    {id:"t3",eventId:"e3",text:"Pack EFTPOS charger",done:false},
    {id:"t4",eventId:"e3",text:"Prepare display signage",done:false}
  ]
 };
}
function blankData(){return {schema:1,version:VERSION,lastBackup:null,settings:{business:"",currency:"AUD",locale:"en-AU",lowStock:5,onboardingComplete:true},products:[],events:[],allocations:[],sales:[],expenses:[],tasks:[]}}
let state=load();
function load(){try{return JSON.parse(sessionStorage.getItem(KEY))||demoData()}catch(e){return demoData()}}
function save(){sessionStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}
function toggleMenu(){$("#sidebar").classList.toggle("open")}
function navTo(page){location.hash=page; render(); $("#sidebar").classList.remove("open")}
// Purchase link configuration. Paste the live Etsy listing URL here once published.
const PURCHASE_URL = "https://www.etsy.com/au/listing/4583941352/craft-fair-vendor-app-inventory-sales";
function openPurchase(event){
  if(event) event.preventDefault();
  if(PURCHASE_URL){ window.open(PURCHASE_URL, "_blank", "noopener,noreferrer"); return false; }
  if(typeof toast === "function") toast("Available on Etsy soon");
  else alert("MarketMate will be available on Etsy soon.");
  return false;
}

const navItems=[["dashboard","⌂","Dashboard"],["events","◫","Events"],["products","◇","Products"],["inventory","▦","Inventory"],["market","●","Market Mode"],["sales","↗","Sales"],["insights","⌁","Insights"],["sep","",""] ,["backup","↧","Demo & Full Version"],["settings","⚙","Settings"],["help","?","Help"]];
function renderNav(){
 $("#nav").innerHTML=navItems.map(([id,ico,label])=>id==="sep"?'<div class="sep"></div>':`<button class="${current()===id?'active':''}" onclick="navTo('${id}')"><span class="ico">${ico}</span><span>${label}</span></button>`).join("");
 $("#sideShop").textContent=state.settings?.business||"Willow & Field Studio"; $("#sideVersion").textContent="Demo";
}
function current(){return (location.hash||"#dashboard").slice(1)}
function pageTitle(title,sub=""){ $("#pageTitleWrap").innerHTML=`<h1>${title}</h1><div class="sub">${sub}</div>` }

function totalCost(p){return Number(p.material||0)+Number(p.labor||0)+Number(p.packaging||0)+Number(p.other||0)}
function productBy(id){return state.products.find(p=>p.id===id)}
function eventBy(id){return state.events.find(e=>e.id===id)}
function salesForEvent(id){return state.sales.filter(s=>s.eventId===id)}
function unitsSold(eventId,productId){return state.sales.filter(s=>s.eventId===eventId&&(!productId||s.productId===productId)).reduce((a,s)=>a+Number(s.qty),0)}
function revenueEvent(id){return salesForEvent(id).reduce((a,s)=>a+(s.qty*s.price-s.discount),0)}
function cogsEvent(id){return salesForEvent(id).reduce((a,s)=>a+s.qty*totalCost(productBy(s.productId)||{}),0)}
function eventExpenses(id){
 const e=eventBy(id)||{}; return Number(e.stall||0)+Number(e.travel||0)+Number(e.parking||0)+Number(e.staff||0)+Number(e.misc||0)+state.expenses.filter(x=>x.eventId===id).reduce((a,x)=>a+Number(x.amount||0),0)
}
function profitEvent(id){return revenueEvent(id)-cogsEvent(id)-eventExpenses(id)}
function sellThrough(eventId){
 const packed=state.allocations.filter(a=>a.eventId===eventId).reduce((a,x)=>a+Number(x.packed||0),0), sold=unitsSold(eventId);
 return packed?Math.round(sold/packed*100):0
}
function eventAvailable(eventId,productId){
 const p=productBy(productId); if(!p)return 0;
 const a=state.allocations.find(x=>x.eventId===eventId&&x.productId===productId);
 if(!a || Number(a.packed||0)<=0) return Number(p.stock||0);
 return Math.max(0,Math.min(Number(p.stock||0),Number(a.packed||0)-unitsSold(eventId,productId)));
}
function nextEvent(){return state.events.filter(e=>e.status!=="Completed").sort((a,b)=>a.date.localeCompare(b.date))[0]}
function lastEvent(){return state.events.filter(e=>e.status==="Completed").sort((a,b)=>b.date.localeCompare(a.date))[0]}
function prepPct(eventId){let t=state.tasks.filter(x=>x.eventId===eventId);return t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0}
function stockReady(eventId){let a=state.allocations.filter(x=>x.eventId===eventId);let p=a.reduce((s,x)=>s+Number(x.planned||0),0),k=a.reduce((s,x)=>s+Number(x.packed||0),0);return {packed:k,planned:p,pct:p?Math.round(k/p*100):0}}
function bestProduct(eventId){
 const map={}; salesForEvent(eventId).forEach(s=>map[s.productId]=(map[s.productId]||0)+s.qty*s.price);
 const id=Object.entries(map).sort((a,b)=>b[1]-a[1])[0]?.[0]; return productBy(id)?.name||"—";
}
function dateText(d){return new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}
function daysTo(d){return Math.ceil((new Date(d+"T00:00:00")-new Date())/86400000)}

function renderDashboard(){
 const n=nextEvent(), l=lastEvent(), sr=n?stockReady(n.id):{packed:0,planned:0,pct:0};
 pageTitle("Dashboard","What needs your attention?");
 const tasks=n?state.tasks.filter(t=>t.eventId===n.id):[];
 const low=state.products.filter(p=>p.stock<=p.threshold);
 const days=n?Math.max(0,daysTo(n.date)):0;
 const totalProducts=state.products.length;
 const healthy=totalProducts-low.length;
 const healthPct=totalProducts?Math.round(healthy/totalProducts*100):100;
 $("#view").innerHTML=`
 ${state.products.length===0?`<div class="onboard-strip"><div><strong>Your workspace is ready.</strong><div class="sub">Add a product and an event to start getting useful numbers.</div></div><div class="actions"><button class="btn small" onclick="openProduct()">Add product</button><button class="btn small" onclick="openEvent()">Add event</button></div></div>`:""}
 <div class="card hero">
  <div class="heroline"><div><div class="eyebrow">Next market</div><h2>${n?.name||"Nothing booked yet"}</h2><div class="hero-meta">${n?`<span>${dateText(n.date)}</span><span>${n.location||"Location not set"}</span><span>${days} day${days===1?'':'s'} away</span>`:`<span>Create an event to start planning</span>`}</div></div>${n?`<span class="badge good">${n.status}</span>`:`<button class="btn primary" onclick="openEvent()">+ Add event</button>`}</div>
 </div>

 <div class="grid cols4 section">
  ${kpi("Revenue target",n?money(n.target):"—","Upcoming event")}
  ${kpi("Stock ready",n?`${sr.packed} / ${sr.planned}`:"—",n?`${sr.pct}% packed`:"No stock plan","accentk")}
  ${kpi("Break-even",n?money(Math.round(eventExpenses(n.id)/0.62)):"—","Planning estimate","warnk")}
  ${kpi("Prep complete",n?`${prepPct(n.id)}%`:"—","Checklist completion")}
 </div>

 <div class="grid cols2 section">
  <div class="card">
    <div class="sectionhead"><div class="sectiontitle"><div class="sectionicon">✓</div><h2>Still to do</h2></div></div>
    ${tasks.length?tasks.map(t=>`<label class="checkrow"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><span style="${t.done?'text-decoration:line-through;color:var(--muted2)':''}">${t.text}</span></label>`).join(""):'<div class="empty">No preparation tasks yet.</div>'}
    <div class="dashboard-footer">
      <button class="add-task" ${!n?'disabled':''} onclick="addDashboardTask('${n?.id||""}')">＋ Add task</button>
      <span>${tasks.filter(t=>t.done).length} of ${tasks.length} completed</span>
    </div>
  </div>

  <div class="card">
    <div class="sectionhead"><div class="sectiontitle"><div class="sectionicon">◇</div><h2>Stock to watch</h2></div></div>
    ${low.length
      ? low.map(p=>`<div class="row"><div><strong>${p.name}</strong><span class="sub">${p.sku||p.category||"Product"}</span></div><span class="badge ${p.stock<=2?'bad':'warn'}">${p.stock} left</span></div>`).join("")
      : `<div class="stock-clear"><strong>Everything looks well stocked.</strong>All ${totalProducts} product line${totalProducts===1?' is':'s are'} above alert thresholds for the upcoming market.</div>`}
    <div class="dashboard-footer">
      <span>Inventory health: ${low.length?"Needs attention":"Optimal"}</span>
      <span class="health-status">${healthPct}% IN STOCK</span>
    </div>
  </div>
 </div>

 <div class="grid cols2 section">
  <div class="card">
    <div class="sectionhead"><div class="sectiontitle"><div class="sectionicon">ϟ</div><h2>Quick actions</h2></div></div>
    <div class="quickactions">
      <button class="qa-card" onclick="navTo('market')"><span class="qa-icon">▤</span><strong>Record sale</strong><span class="tiny">Open<br>Market Mode</span></button>
      <button class="qa-card" onclick="openProduct()"><span class="qa-icon">⊕</span><strong>Add product</strong><span class="tiny">Grow your<br>catalogue</span></button>
      <button class="qa-card" onclick="openEvent()"><span class="qa-icon">▣</span><strong>Add event</strong><span class="tiny">Plan another<br>market</span></button>
      <button class="qa-card" onclick="quickBackup()"><span class="qa-icon">☁</span><strong>Back up</strong><span class="tiny">Protect<br>your data</span></button>
    </div>
  </div>

  <div class="card">
    <div class="sectionhead"><div class="sectiontitle"><div class="sectionicon">◷</div><h2>Last event</h2></div>${l?`<span class="badge">${dateText(l.date)}</span>`:""}</div>
    ${l?`<div class="grid cols2">
      <div class="metricmini"><span>Revenue</span><strong>${money(revenueEvent(l.id))}</strong></div>
      <div class="metricmini"><span>Profit</span><strong style="color:var(--good)">${money(profitEvent(l.id))}</strong></div>
      <div class="metricmini"><span>Best seller</span><strong>${bestProduct(l.id)}</strong></div>
      <div class="metricmini"><span>Sell-through</span><strong>${sellThrough(l.id)}%</strong></div>
    </div>
    <div class="dashboard-footer" style="justify-content:flex-end"><button class="linkbtn" onclick="navTo('events')">View full event breakdown →</button></div>`
    :'<div class="empty">Complete your first market to see performance here.</div>'}
  </div>
 </div>`;
}

function addDashboardTask(eventId){
 if(!eventId){alert("Add an upcoming event first.");return}
 const textValue=prompt("Add a preparation task:");
 if(!textValue || !textValue.trim())return;

function parseCSV(text){
 text=String(text||"").replace(/^\uFEFF/,"");
 const rows=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"'){quoted=false}else field+=c}
  else if(c==='"'){quoted=true}
  else if(c===','){row.push(field);field=""}
  else if(c==='\n'){row.push(field);rows.push(row);row=[];field=""}
  else if(c!=='\r'){field+=c}

 row.push(field); if(row.some(x=>String(x).trim()!==""))rows.push(row);

}

}

 });

 <div class="section"><div class="sectionhead"><h2 style="color:white">Recent sales</h2><span class="badge dark">${salesForEvent(active.id).length} lines</span></div>${salesForEvent(active.id).slice(-4).reverse().map(s=>`<div class="row" style="border-color:#315046"><span>${productBy(s.productId)?.name||"Product"} × ${s.qty}<span class="tiny" style="color:#9eb8ad"> · ${s.payment}</span></span><strong>${money(s.qty*s.price-s.discount)}</strong></div>`).join("")||'<div class="sub" style="color:#adc4ba;padding:12px 0">No sales recorded yet.</div>'}</div>
 <div class="salefooter"><div><div class="eyebrow" style="color:#a9c2b8">Current sale</div><strong style="font-size:18px">${cartUnits} item${cartUnits===1?'':'s'} · ${money(cartTotal)}</strong></div><div class="actions"><button class="btn" ${!cart.length?'disabled':''} onclick="cart=[];renderMarket()">Clear</button><button class="btn accent" ${!cart.length?'disabled':''} onclick="checkout()">Complete sale</button></div></div>
 </div>`;
}
function addCart(id){
 const e=nextEvent(); if(!e)return;
 const available=eventAvailable(e.id,id), existing=cart.find(c=>c.productId===id), inCart=existing?.qty||0;
 if(inCart>=available){alert("No more of this product is available for this event.");return}
 if(existing)existing.qty++;else cart.push({productId:id,qty:1});renderMarket()
}
function undoLastSale(eventId){
 const list=salesForEvent(eventId).slice().sort((a,b)=>b.date.localeCompare(a.date)); const s=list[0];
 if(!s){alert("There is no sale to undo.");return}
 if(!confirm(`Undo the last sale: ${productBy(s.productId)?.name||"product"} × ${s.qty}?`))return;
 const p=productBy(s.productId); if(p)p.stock=Number(p.stock||0)+Number(s.qty||0);
 state.sales=state.sales.filter(x=>x.id!==s.id); save(); toast("Last sale undone"); renderMarket();
}
function checkout(){
 const e=nextEvent(); if(!cart.length)return alert("Add at least one product.");
 openModal(`<div class="sectionhead"><h2>Complete sale</h2><button class="btn small" onclick="closeModal()">✕</button></div>
 <div class="list">${cart.map(x=>`<div class="row"><span>${productBy(x.productId).name} × ${x.qty}</span><strong>${money(productBy(x.productId).price*x.qty)}</strong></div>`).join("")}</div>
 <div class="field section"><label>Payment type</label><select id="paytype"><option>Card</option><option>Cash</option><option>Other</option></select></div>
 <div class="field section"><label>Total discount</label><input id="discount" type="number" value="0"></div>
 <button class="btn accent section" style="width:100%" onclick="finishSale('${e.id}')">Record ${money(cart.reduce((a,x)=>a+x.qty*productBy(x.productId).price,0))}</button>`);
}
function finishSale(eventId){
 for(const x of cart){if(x.qty>eventAvailable(eventId,x.productId)){alert(`${productBy(x.productId)?.name||"Product"} no longer has enough available stock. Please adjust the sale.`);closeModal();renderMarket();return}}
 const discount=Math.max(0,num("discount")), pay=val("paytype"), subtotal=cart.reduce((a,x)=>a+x.qty*productBy(x.productId).price,0);
 if(discount>subtotal){alert("Discount cannot exceed the sale subtotal.");return}
 cart.forEach(x=>{let p=productBy(x.productId);const lineSubtotal=x.qty*p.price;const lineDiscount=subtotal?discount*(lineSubtotal/subtotal):0;state.sales.push({id:uid(),eventId,productId:x.productId,qty:x.qty,price:p.price,discount:lineDiscount,payment:pay,date:new Date().toISOString()});p.stock=Math.max(0,p.stock-x.qty)});
 cart=[];save();closeModal();toast("Sale recorded");renderMarket()
}

function renderSales(){
 pageTitle("Sales","What did you sell?");
 $("#view").innerHTML=`<div class="actions section"><span class="demo-chip">CSV export available in full version</span><button class="btn" onclick="navTo('market')">Open Market Mode</button></div>
 <div class="card section"><table><thead><tr><th>Date</th><th>Event</th><th>Product</th><th>Qty</th><th>Payment</th><th>Total</th><th></th></tr></thead><tbody>
 ${state.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<tr><td>${new Date(s.date).toLocaleString("en-AU")}</td><td>${eventBy(s.eventId)?.name||"—"}</td><td>${productBy(s.productId)?.name||"—"}</td><td>${s.qty}</td><td>${s.payment}</td><td>${money(s.qty*s.price-s.discount)}</td><td><button class="btn small danger" onclick="deleteSale('${s.id}')">Delete</button></td></tr>`).join("")}
 </tbody></table></div>`;

function deleteSale(id){let s=state.sales.find(x=>x.id===id);if(confirm("Delete this sale and return its quantity to stock?")){let p=productBy(s.productId);if(p)p.stock+=Number(s.qty);state.sales=state.sales.filter(x=>x.id!==id);save();renderSales()}}

function renderInsights(){
 pageTitle("Insights","What's working?");
 const completed=state.events.filter(e=>e.status==="Completed");
 const best=completed.slice().sort((a,b)=>profitEvent(b.id)-profitEvent(a.id))[0];
 const prodPerf=state.products.map(p=>({p,rev:state.sales.filter(s=>s.productId===p.id).reduce((a,s)=>a+s.qty*s.price-s.discount,0),units:state.sales.filter(s=>s.productId===p.id).reduce((a,s)=>a+s.qty,0)})).sort((a,b)=>b.rev-a.rev);
 const maxRev=Math.max(1,...completed.map(e=>revenueEvent(e.id)));
 $("#view").innerHTML=`
 <div class="grid cols4">
 ${kpi("Best Market",best?.name||"—",best?money(profitEvent(best.id))+" profit":"")}
 ${kpi("Most Profitable Product",prodPerf[0]?.p.name||"—",prodPerf[0]?money(prodPerf[0].rev)+" revenue":"")}
 ${kpi("Average Event Profit",completed.length?money(completed.reduce((a,e)=>a+profitEvent(e.id),0)/completed.length):"—","Completed events")}
 ${kpi("Average Sell-through",completed.length?Math.round(completed.reduce((a,e)=>a+sellThrough(e.id),0)/completed.length)+"%":"—","Completed events")}
 </div>
 <div class="grid cols2 section">
  <div class="card"><h2>Revenue by event</h2><div class="section">${completed.map(e=>`<div style="margin:12px 0"><div class="sectionhead"><span>${e.name}</span><strong>${money(revenueEvent(e.id))}</strong></div><div class="bar"><span style="width:${revenueEvent(e.id)/maxRev*100}%"></span></div></div>`).join("")}</div></div>
  <div class="card"><h2>Top products</h2>${prodPerf.map(x=>`<div class="row"><div><strong>${x.p.name}</strong><span class="sub">${x.units} units sold</span></div><strong>${money(x.rev)}</strong></div>`).join("")}</div>
 </div>
 <div class="card section"><div class="sectionhead"><h2>What should I bring?</h2><span class="badge">Transparent suggestion</span></div>
 <div class="sub">Suggestion = average units sold across completed events × 1.20 buffer, rounded up.</div>
 <table class="section"><thead><tr><th>Product</th><th>Avg sold</th><th>Suggested qty</th><th>Why</th></tr></thead><tbody>
 ${state.products.map(p=>{let vals=completed.map(e=>unitsSold(e.id,p.id));let avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;let sug=Math.ceil(avg*1.2);return `<tr><td>${p.name}</td><td>${avg.toFixed(1)}</td><td><strong>${sug}</strong></td><td>20% buffer on historical average</td></tr>`}).join("")}
 </tbody></table></div>`;
}

function quickBackup(){demoBlocked("Backup is disabled in the hosted demo. It is included in the full version.")}
$("#restoreInput").addEventListener("change",async e=>{
 if(DEMO_MODE){e.target.value="";demoBlocked("Restore is disabled in the hosted demo.");return}
 const f=e.target.files[0]; if(!f)return;
 try{
  const parsed=JSON.parse(await f.text());
  if(parsed.app!=="MarketMate"||!parsed.data||!Array.isArray(parsed.data.products)||!Array.isArray(parsed.data.events))throw Error("Not a valid MarketMate backup");
  const d=parsed.data;
  const summary=`${d.events.length} events, ${d.products.length} products, ${d.sales?.length||0} sales records`;
  if(confirm(`Restore this backup?\n\n${summary}\n\nCurrent data will be replaced.`)){
    quickBackup(); state=d; save(); alert("Restore complete."); render();
  }
 }catch(err){alert("Restore failed: "+err.message)}
 e.target.value="";
});
function exportCSV(type){
 let rows=[];
 if(type==="products") rows=[["Product Name","SKU","Category","Selling Price","Material Cost","Labour Cost","Packaging Cost","Other Cost","Opening Stock","Low Stock Threshold"],...state.products.map(p=>[p.name,p.sku,p.category,p.price,p.material,p.labor,p.packaging,p.other,p.stock,p.threshold])];
 if(type==="sales") rows=[["Date","Event","Product","Qty","Price","Discount","Payment","Total"],...state.sales.map(s=>[s.date,eventBy(s.eventId)?.name||"",productBy(s.productId)?.name||"",s.qty,s.price,s.discount,s.payment,s.qty*s.price-s.discount])];
 if(type==="expenses") rows=[["Date","Event","Type","Amount"],...state.expenses.map(x=>[x.date,eventBy(x.eventId)?.name||"",x.type,x.amount])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
 download(`marketmate-${type}-${new Date().toISOString().slice(0,10)}.csv`,csv,"text/csv");
}
function download(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
